# Publishes a release when a version tag (vX.Y.Z) is pushed:
#   1. creates the GitHub release with generated notes;
#   2. points the Homebrew formula in codebymaribel/homebrew-tap at the new
#      tag and its sha256, so `brew upgrade eva` picks it up.
#
# Needs the secret HOMEBREW_TAP_TOKEN: a fine-grained token with access to
# codebymaribel/homebrew-tap only and "Contents: Read and write".
#
# No third-party actions: everything below is plain shell, `gh` and `git`,
# which are preinstalled on GitHub's runners. The tag reaches the shell as an
# environment variable (never pasted into the script with ${{ }}) and is
# checked against vX.Y.Z before it is used.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release in this repo

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      TAP_REPO: codebymaribel/homebrew-tap
      FORMULA: Formula/eva.rb
    steps:
      - name: Check tag format
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes --title "$TAG"

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Secret HOMEBREW_TAP_TOKEN is missing"
            exit 1
          fi

          url="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL --retry 3 -o source.tar.gz "$url"
          sha=$(sha256sum source.tar.gz | cut -d' ' -f1)
          echo "url=$url"
          echo "sha256=$sha"

          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          cd tap
          sed -i -E \
            -e "s|^  url \".*\"$|  url \"${url}\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"${sha}\"|" \
            "$FORMULA"
          grep -q "url \"${url}\"" "$FORMULA"
          grep -q "sha256 \"${sha}\"" "$FORMULA"

          if git diff --quiet; then
            echo "Formula already points at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "eva ${TAG#v}"
          git push origin HEAD
